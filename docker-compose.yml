services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: kickmap
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env
    environment:
      # Override REDIS_URL so the app connects to the redis service, not localhost
      REDIS_URL: redis://redis:6379
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: loki
      options:
        # The loki log driver is a plugin running in the DOCKER DAEMON on the
        # host, not inside the compose network — it cannot resolve the `loki`
        # service name via Docker's embedded DNS. It must reach Loki through
        # the published host port. Do not "fix" this to http://loki:3100.
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: "2"
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-external-labels: "container={{.Name}},environment=production"
        loki-pipeline-stages: |
          - json:
              expressions:
                log_level: level
                module: module
                duration: duration
          - labels:
              log_level:
              module:

  redis:
    image: redis:7-alpine
    container_name: kickmap-redisb
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.0.0
    container_name: kickmap-loki
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - loki_data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

volumes:
  redis_data:
  loki_data:

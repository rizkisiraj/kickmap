services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: kickmap
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env
    environment:
      # Override REDIS_URL so the app connects to the redis service, not localhost
      REDIS_URL: redis://redis:6379
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-external-labels: "container={{.Name}},environment=production"
        loki-pipeline-stages: |
          - json:
              expressions:
                level: level
                module: module
                duration: duration
                resultCount: resultCount
          - labels:
              level:
              module:

  redis:
    image: redis:7-alpine
    container_name: kickmap-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.0.0
    container_name: kickmap-loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

volumes:
  redis_data:
  loki_data:
